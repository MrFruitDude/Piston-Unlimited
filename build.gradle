tableau {
    project {
        group = "com.ldtteam"
        publisher = "LDTTeam"
        modId = "multipiston"
    }

    maven {
        publishAsLDTTeamMod()
        publishLocally()
        pom({
            usingGnu3License()
            usingGit()
        })
    }
}

repositories {
    maven {
        name = "LocalBlockUI"
        url = uri(rootProject.layout.projectDirectory.dir("../BlockUI/repo"))
    }
    maven {
        name = "LocalDomumOrnamentum"
        url = uri(rootProject.layout.projectDirectory.dir("../Domum-Ornamentum/repo"))
    }
    maven {
        name = "LocalStructurize"
        url = uri(rootProject.layout.projectDirectory.dir("../Structurize/repo"))
    }
}

dependencies {
    implementation "com.ldtteam:blockui:0.0.1-local"
    implementation "com.ldtteam:domum-ornamentum:1.0.0-local"
    implementation "com.ldtteam:structurize:0.0.1-local"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(["-Xmaxerrs", "1000", "-Xmaxwarns", "1000"])
}

tasks.matching { it.name == "neoFormPatch" }.configureEach {
    doFirst {
        def decompileJar = project.file("build/neoForm/neoFormJoined26.3-1/steps/decompile/outputs.jar")
        if (!decompileJar.exists()) return

        def workDir = new File(project.buildDir, "onlyin-fix")
        workDir.deleteDir()
        workDir.mkdirs()

        def javaFiles = []
        project.zipTree(decompileJar).visit { details ->
            if (details.directory || !details.path.endsWith(".java")) return
            def dest = new File(workDir, details.path)
            dest.parentFile.mkdirs()
            details.copyTo(dest)
            javaFiles << dest
        }

        javaFiles.each { file ->
            def text = file.text
            def fixed = text.replaceAll(
                /(?m)^( +)@OnlyIn\s*\([^)]*\)\n(\1(?:public |private |protected )?(?:static |final |abstract )?(?:class |interface |record |enum |@interface ))/,
                '$2'
            ).replaceAll(
                /(?m)^(\}+)\n( +(?:public|private|protected)\s+(?:static\s+)?(?:class |interface |record |enum ))/,
                '$1\n\n$2'
            )
            if (fixed != text) file.text = fixed
        }

        new groovy.ant.AntBuilder().jar(
            destfile: decompileJar.absolutePath,
            basedir: workDir,
            update: true
        )
        workDir.deleteDir()
    }
}

// MC 26.3: NeoForge's AT widens the anonymous HolderSet$1.contents() to public,
// but NeoGradle 7.1.x's source transformer cannot address anonymous classes, so
// the recompile fails ("attempting to assign weaker access privileges").
// Apply that single AT line to the transformed source before recompiling.
tasks.matching { it.name == 'neoFormRecompile' }.configureEach {
    doFirst {
        def holderSet = project.file("build/neoForm/neoFormJoined26.3-1/steps/transformSource/transformed/net/minecraft/core/HolderSet.java")
        if (!holderSet.exists()) return
        def text = holderSet.text
        def fixed = text.replaceFirst(
            /(return new HolderSet\.Named<T>\(owner, key\) \{\s*@Override\s*)protected (List<Holder<T>> contents\(\))/,
            '$1public $2')
        if (fixed != text) holderSet.text = fixed
    }
}
